<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oddly Sourced · Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
:root { --paper: #ECE2CD; --ink: #181412; --vermilion: #E4572E; --muted: rgba(24, 20, 18, 0.62); --rule: rgba(24, 20, 18, 0.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #181412; --ink: #ECE2CD; --muted: rgba(236, 226, 205, 0.66); --rule: rgba(236, 226, 205, 0.2); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
main { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
.brand { font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; }
.brand b { color: var(--vermilion); }
h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.05; margin: 10px 0 8px; font-variation-settings: "wdth" 88; }
.lede { color: var(--muted); margin: 0 0 28px; }
ol { list-style: none; padding: 0; margin: 0; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--rule); scroll-margin-top: 16px; }
.row:target { background: color-mix(in srgb, var(--vermilion) 12%, transparent); }
.seal { width: 52px; height: 52px; border-radius: 50%; background: var(--vermilion); color: #181412; font-weight: 800; font-size: 15px; display: grid; place-items: center; border: 4px solid var(--ink); }
.claim { margin: 0 0 6px; font-weight: 700; }
.links { margin: 0; padding-left: 18px; }
.links a { color: inherit; text-decoration-color: var(--vermilion); text-underline-offset: 3px; overflow-wrap: anywhere; }
.quote { margin: 6px 0 0; color: var(--muted); font-style: italic; }
.calc { margin: 0; color: var(--muted); }
footer { margin-top: 36px; padding-top: 16px; border-top: 2px solid var(--ink); color: var(--muted); font-size: 15px; }
a.back { color: inherit; }
.head { display: flex; align-items: center; gap: 18px; margin-bottom: 28px; }
.head h1 { margin: 6px 0 6px; }
.head .lede { margin: 0; }
.seal-link { flex: none; display: block; border-radius: 50%; transition: transform 120ms ease; }
.seal-link:hover, .seal-link:focus-visible { transform: rotate(-8deg) scale(1.05); outline: none; }
.seal-link:focus-visible { box-shadow: 0 0 0 3px var(--vermilion); }
.head img { width: clamp(72px, 16vw, 104px); height: auto; display: block; }
/* The seal's black ring disappears on a dark page: print it on a paper disc there. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .head img { background: #ECE2CD; border-radius: 50%; padding: 5px; } }
.eps { display: grid; gap: 22px; margin-top: 8px; }
/* Episode card: a printed block. Hover slides the ink offset into a vermilion one, press stamps it down. */
.ep { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; padding: 18px 20px; color: inherit; text-decoration: none;
  background: var(--paper); border: 3px solid var(--ink); box-shadow: 7px 8px 0 var(--ink); transition: transform 120ms ease, box-shadow 120ms ease; }
.ep:hover, .ep:focus-visible { transform: translate(-2px, -2px); box-shadow: 10px 11px 0 var(--vermilion); outline: none; }
.ep:active { transform: translate(3px, 3px); box-shadow: 3px 4px 0 var(--ink); }
.ep .num { width: 60px; height: 60px; border-radius: 50%; background: var(--vermilion); color: #181412; border: 4px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 17px; }
.ep .ex { display: block; color: var(--vermilion); font-weight: 800; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
.ep .t { display: block; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.1; font-variation-settings: "wdth" 88; }
.ep .meta { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.ep .go { font-size: 28px; font-weight: 800; }
/* Home: the wordmark signs the page under the list, so it moves down as exhibits are added. */
.sign { text-align: center; margin: 56px 0 0; }
</style>
</head>
<body><main><div class="head"><a class="seal-link" href="https://www.youtube.com/@OddlySourced" rel="noopener" title="Oddly Sourced on YouTube"><img src="./assets/seal.png" alt="Oddly Sourced on YouTube" width="96" height="96"></a><div><h1>Sources</h1><p class="lede">Strange things that actually happened. Every claim sourced. Pick an episode to see every source behind it.</p></div></div><nav class="eps"><a class="ep" href="./001-poon-lim/"><span class="num">001</span><span><span class="ex">Exhibit 001</span><span class="t">Poon Lim</span><span class="meta">90 sources, one row per on-screen seal</span></span><span class="go" aria-hidden="true">→</span></a></nav><p class="brand sign">Oddly <b>Sourced</b></p></main></body>
</html>
